<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="JSON Explorer — visualize JSON as an interactive graph or tree, validate and repair it, and compare two documents side by side. Free, fast and private: your data never leaves the browser." />
  <meta name="theme-color" content="#0f1d29" />
  <meta name="color-scheme" content="dark light" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="JSON Explorer — Visualize, explore & compare JSON" />
  <meta property="og:description" content="Interactive graph and tree views, search, validation, repair and structural diffs for JSON — right in your browser." />
  <meta property="og:image" content="%PUBLIC_URL%/android-chrome-512x512.png" />
  <meta name="twitter:card" content="summary" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <title>JSON Explorer — Visualize, explore & compare JSON</title>
  <script>
    // Apply the saved (or system) theme before the app renders to avoid a flash.
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        var preference = params.get('theme');
        if (preference !== 'light' && preference !== 'dark' && preference !== 'system') {
          preference = params.get('embed') === '1' ? 'dark' : JSON.parse(localStorage.getItem('json-explorer:theme') || '"system"');
        }
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run JSON Explorer.</noscript>
  <div id="root"></div>
</body>

</html>
